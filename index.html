<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym Timer" />
    
    <!-- SEO -->
    <title>Gym Interval Timer - HIIT, Tabata, EMOM</title>
    <meta name="description" content="Timer d'intervalle pour musculation, HIIT, Tabata et EMOM. Interface optimisée mobile avec sons et annonces vocales." />
    <meta name="keywords" content="gym, timer, interval, HIIT, tabata, EMOM, musculation, fitness, entraînement" />
    <meta name="author" content="Gym Timer" />

    <!-- Open Graph -->
    <meta property="og:title" content="Gym Interval Timer" />
    <meta property="og:description" content="Timer d'intervalle pour musculation, HIIT, Tabata et EMOM." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gym Interval Timer" />
    <meta name="twitter:description" content="Timer HIIT, Tabata, EMOM pour vos entraînements" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
